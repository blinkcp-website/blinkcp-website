# "Sunny" is the name for the marketing automation across both workflows.
name: Sunny - Weekly Social Content

on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-social-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "Sunny (Blink marketing bot)"
          git config user.email "actions@users.noreply.github.com"

      - name: Generate weekly social content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "You are Sunny, the marketing automation for Blink Capital Partners. You prepare next week's social content batch for Blink Capital Partners (blinkcp.com), a residential real estate investor loan originator. They lend on Fix & Flip, Ground-Up Construction, and DSCR Rental loans. Their Instagram audience is house flippers, small developers, and rental property (buy-and-hold) investors. The brand voice is confident, straightforward, and educational -- a thought leader helping investors move faster on deals, not a hard-sell lender.

          Context you should use: this repo contains the live marketing site (index.html, loan-programs.html, dscr-calculator.html, case-studies.html with 3 illustrative deals: a fix-and-flip, a ground-up construction, and a DSCR rental). Pull real facts, numbers, and terminology from loan-programs.html and case-studies.html so content stays accurate and on-brand -- never invent rates, terms, or numbers that aren't grounded in the site content.

          Your task:
          1. git fetch origin social-content, then create or reset a branch named social-content from origin/social-content if it exists, otherwise from origin/main.
          2. Create a new dated file at social-content/YYYY-MM-DD-batch.md (use next Monday's date as the batch week start) containing the ready-to-post INSTAGRAM batch for that week: 3-4 Instagram posts/reels concepts appropriate for that week's rotation (mix of educational carousel, case-study/deal spotlight, market/thought-leadership hot-take, and a light engagement or myth-busting post -- vary week to week based on what's already been posted in prior batch files in social-content/ if any exist). For each post include: post type/format, a scroll-stopping hook line, full caption copy with a clear CTA driving to blinkcp.com or DM, and 5-8 relevant hashtags from a real-estate-investor hashtag mix.
          3. Keep captions concise, avoid corporate jargon, write like a knowledgeable peer talking to investors, not an ad.
          3b. ALSO write social-content/YYYY-MM-DD-slides.json (same date as the batch file) so the carousel slides can be rendered to images automatically. Shape:
          {\"posts\":[{\"name\":\"YYYY-MM-DD-postN-short-slug\",\"slides\":[ ... ]}]}
          Include an entry only for posts that are carousels or multi-slide statics -- skip single-image and reel concepts. Each slide object uses one of four types, and the text must match the slide breakdown you wrote in the .md file:
            {\"type\":\"hook\",\"eyebrow\":\"Loan program or category\",\"headline\":\"the hook, <br> allowed\",\"body\":\"one supporting line\",\"swipe\":\"Swipe →\"}
            {\"type\":\"num\",\"n\":1,\"headline\":\"short point\",\"body\":\"one or two sentences\"}
            {\"type\":\"stat\",\"eyebrow\":\"framing label\",\"headline\":\"80% LTV\",\"body\":\"what it refers to\"}
            {\"type\":\"cta\",\"headline\":\"the ask\",\"body\":\"supporting line\",\"url\":\"blinkcp.com\"}
          Keep headlines short -- they render at large sizes on a 1080x1350 slide. Use \"stat\" only when the headline is a short figure. Every post must end with a \"cta\" slide. Do not invent figures; pull them from the site content as above.
          3c. ALSO write social-content/YYYY-MM-DD-linkedin.md -- a SEPARATE batch of 2-3 LinkedIn posts for the same week. LinkedIn is a different medium from Instagram and must not be a reposting of the same copy.
          Audience: the people who SEND deals, not only the people who take them -- realtors working investor clients, general contractors, wholesalers, title reps, and conventional mortgage brokers who cannot do investor loans and currently turn that business away. Secondary audience: the investors themselves.
          Format and voice: open with a specific, concrete first line (LinkedIn truncates after roughly 200 characters, so the hook must land before the fold). Short paragraphs, one idea each, generous line breaks. Write as an operator explaining how something actually works, not as an ad. No emoji walls. 3-5 hashtags maximum at the end, or none -- LinkedIn does not reward hashtag stuffing the way Instagram does.
          Mix across the batch: one post explaining a mechanic a referral partner would want to understand (how a draw schedule works, why a DSCR deal dies in underwriting, what makes a file close in 10 days); one short deal breakdown with real numbers from case-studies.html framed as what it meant for the agent or builder involved; and optionally one plain-spoken take on current market conditions. At least one post per batch should give a referral partner a reason to send a deal rather than asking an investor to borrow.
          For each post include: a label for the angle, the full post text ready to paste, and the hashtags. Do not invent rates, terms, or figures -- everything comes from the site content.
          4. Commit the new file to the social-content branch, then run: git push --force-with-lease origin social-content. This repo's GITHUB_TOKEN already has write access in this workflow, so a plain git push will work -- do not attempt any GitHub API/MCP tool for this, just use git directly. Do not open a pull request and do not touch any other files or branches -- this branch is just a content staging area for manual human review before anything gets posted.
          5. At the end, output a short plain-text summary of what was drafted, listing the Instagram posts and the LinkedIn posts separately and naming every file you wrote." \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
            --permission-mode acceptEdits

      # Renders the slide JSON into 1080x1350 PNGs using the same markup and CSS
      # as tools/carousel/index.html, so CI output matches the browser tool.
      # Without this the batches stay briefs and nothing is postable.
      - name: Render carousel slides to PNG
        run: |
          set -euo pipefail
          git fetch origin social-content
          git checkout social-content

          SLIDES=$(ls -1 social-content/*-slides.json 2>/dev/null | sort | tail -1 || true)
          if [ -z "$SLIDES" ]; then
            echo "No slides JSON found - nothing to render."
            exit 0
          fi
          echo "Rendering $SLIDES"

          # render.mjs and index.html live on the default branch; bring just those
          # two files across without disturbing the content branch.
          git checkout "${{ github.sha }}" -- tools/carousel/

          npm install --no-save puppeteer@23
          OUTDIR="social-content/$(basename "$SLIDES" -slides.json)-slides"
          node tools/carousel/render.mjs "$SLIDES" "$OUTDIR"

          git rm -r --cached tools/carousel >/dev/null 2>&1 || true
          rm -rf tools node_modules package-lock.json package.json
          git add "$OUTDIR"
          if git diff --cached --quiet; then
            echo "No new slide images."
          else
            git commit -m "Render carousel slides for $(basename "$SLIDES" -slides.json)"
            git push --force-with-lease origin social-content
            echo "Pushed $(ls -1 "$OUTDIR" | wc -l) slide image(s)."
          fi
